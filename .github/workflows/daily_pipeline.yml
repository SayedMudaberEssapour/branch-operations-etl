# Automatically run your python tests whenever you push code to Github or create a pull request



name: Branch Operations ETL - CI

"on":
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Run ETL Automated Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Python environment
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Verify Python syntax
      - name: Check Python syntax
        run: |
          python -m compileall -q src tests

      # Step 5: Generate synthetic source datasets
      - name: Generate synthetic test data
        run: |
          python -m src.generate_data

      # Step 6: Verify required CSV files exist
      - name: Verify generated datasets
        run: |
          test -f data/raw/branches.csv
          test -f data/raw/transactions.csv
          test -f data/raw/member_visits.csv
          test -f data/raw/staffing.csv

      # Step 7: Execute automated tests
      - name: Run automated tests
        run: |
          python -m pytest tests/ -v

      # Step 8: Report success
      - name: Confirm CI success
        if: success()
        run: |
          echo "All ETL automated tests passed!"
          echo "Branch Operations ETL CI completed successfully."
